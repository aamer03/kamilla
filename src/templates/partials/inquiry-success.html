<section
  class="inquiry-success"
  data-inquiry-success
  hidden
  tabindex="-1"
  aria-label="{{t:forms.thank_you}}"
>
  <p class="eyebrow">{{t:forms.sent_label}}</p>
  <h3>{{t:forms.thank_you}}</h3>
  <p>{{t:forms.success}}</p>
  <p
    class="note"
    data-upload-status
    role="status"
    aria-live="polite"
    hidden
  ></p>
  <button class="button" type="button" data-retry-upload hidden>
    {{t:forms.retry_upload}}
  </button>
  <p><a href="tel:+19293552787">{{t:contact.call_label}} 929-355-2787</a></p>
  <a class="text-link" href="index.html">{{t:forms.back_home}}</a>
</section>
