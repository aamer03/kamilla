<!doctype html>

    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{t:page.meta_title}}</title>
    <meta name="description" content="{{t:page.meta_description}}" />
    <link rel="icon" href="assets/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      href="assets/favicon.svg"
      type="image/svg+xml"
      sizes="any"
    />

      rel="apple-touch-icon"
      href="assets/apple-touch-icon.png"
      sizes="180x180"
    />
    <link rel="stylesheet" href="style.css" />
    <meta
      name="google-site-verification"
      content="T5gDOZJwFrZA5NmFhN7vYfrjDYmaWMcXDFcmjLvcc4I"
    />

  <body>
    <a class="skip" href="#main">{{t:about.skip_to_content}}</a>

    <main id="main" tabindex="-1">{{body}}{{closing}}</main>
    {{footer}}
    <script src="main.js"></script>
